<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Kata-kuti: noughts and crosses with a friend</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="menu" class="screen">
      <header class="title">
        <p class="label">Noughts and crosses</p>
        <h1>Kata-kuti</h1>
        <p class="bn" lang="bn">কাটাকুটি</p>
      </header>
      <div id="online" class="stack">
        <label class="field">
          <span class="label">Your name <em>optional</em></span>
          <input id="name" maxlength="16" autocomplete="nickname" spellcheck="false" placeholder="Anonymous">
        </label>
        <button id="create" class="btn primary">Play with a friend</button>
        <div class="join">
          <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ROOM CODE" aria-label="Room code">
          <button id="join" class="btn">Join</button>
        </div>
      </div>
      <p id="offlineNote" class="note" hidden>Open this game on ikirmikir.com to play with a friend online.</p>
      <div class="divider"><span>or</span></div>
      <button id="local" class="btn quiet">Play on this device</button>
      <p id="menuMsg" class="note" role="status"></p>
    </section>

    <section id="waiting" class="screen" hidden>
      <p class="label">Room code</p>
      <p id="roomCode" class="code"></p>
      <p class="note"><span class="pulse" aria-hidden="true"></span>Waiting for a friend to join</p>
      <button id="invite" class="btn primary">Invite a friend</button>
      <button id="cancel" class="btn quiet">Cancel</button>
    </section>

    <section id="play" class="screen" hidden>
      <div class="scoreboard">
        <div class="side" id="sideX"><span class="mark-sm">×</span><span class="who"></span></div>
        <div class="score" id="score">0 · 0</div>
        <div class="side right" id="sideO"><span class="who"></span><span class="mark-sm">○</span></div>
      </div>
      <p id="turn" class="turn" role="status"></p>
      <div id="board" class="board" role="grid" aria-label="Board"></div>
      <p id="notice" class="note" role="status"></p>
      <div class="actions">
        <button id="again" class="btn primary" hidden>Play again</button>
        <button id="quit" class="btn quiet">Leave</button>
      </div>
      <div id="splash" class="splash" aria-hidden="true">Your move</div>
    </section>
  </main>
  <!-- The Ikirmikir SDK file, copied next to the game (gives window.Ikirmikir). -->
  <script src="ikirmikir.js"></script>
  <script src="game.js"></script>
</body>
</html>
